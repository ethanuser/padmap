<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Remap a controller in keyboard mode and generate Karabiner-Elements JSON.">
<title>Pad Map</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone-note" id="phone-note" role="note" hidden>
  <span class="ic"></span>
  <p><strong>Pad Map is made for desktop.</strong> Open it on the Mac your remote is paired with. You can still look around here.</p>
  <button id="phone-close" class="icon" aria-label="Dismiss"></button>
</div>
<header>
  <a class="brand" href="./">Pad Map</a>
  <span class="tagline">Turn controller buttons into Karabiner rules</span>
  <nav>
    <div class="history">
      <button id="undo" class="icon" data-tip="Undo" data-keys="left_command z" aria-label="Undo" disabled></button>
      <button id="redo" class="icon" data-tip="Redo" data-keys="left_shift left_command z" aria-label="Redo" disabled></button>
    </div>
    <button id="guide" class="icon" data-tip="How it works" aria-label="How it works"></button>
    <button id="options" class="icon" data-tip="Options" aria-label="Options"></button>
    <button id="export" class="primary"><span class="ic"></span>Export<span class="wide"> JSON</span></button>
  </nav>
</header>

<main>
  <div class="bar">
    <div class="modes-wrap">
      <div class="modes" id="modes" role="tablist" aria-label="Modes">
        <span class="thumb" aria-hidden="true"></span>
      </div>
      <button id="edit-mode" class="icon" data-tip="Edit this mode" aria-label="Edit this mode"></button>
      <button id="add-mode" class="icon" data-tip="Add a mode" aria-label="Add a mode"></button>
    </div>
    <div class="rotates">
      <button id="rotate-ccw" class="icon" data-tip="Rotate left" aria-label="Rotate controller left"></button>
      <button id="rotate-cw" class="icon" data-tip="Rotate right" aria-label="Rotate controller right"></button>
    </div>
  </div>

  <section class="stage" id="stage" aria-label="Controller buttons">
    <div class="col left" id="col-left"></div>
    <div class="pad" id="pad"></div>
    <div class="col right" id="col-right"></div>
    <svg class="leaders" id="leaders" aria-hidden="true"></svg>
  </section>
  <div class="extras" id="extras" hidden></div>

  <section class="editor" aria-labelledby="ed-name">
    <div class="ed-head">
      <span id="ed-glyph"></span>
      <h2 id="ed-name">A button</h2>
    </div>
    <div class="ed-grid">
      <div class="ed-label"><span class="ic" data-icon="remote"></span>Remote sends</div>
      <div class="ed-value"><kbd class="cap" id="input-key">G</kbd></div>
      <button id="capture" class="side" data-tip="Press this button on your remote to update its key" data-icon="remote"><span class="ic"></span><span class="lbl">Re-capture</span></button>

      <div class="ed-label" id="picker-label"><span class="ic" data-icon="mac"></span>Mac gets in <span class="mode-chip" id="ed-mode">Anki</span></div>
      <button id="picker-btn" class="picker-btn" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="picker-label picker-value">
        <span class="pv" id="picker-value"></span><span class="chev"></span>
      </button>
      <button id="record" class="side" data-tip="Press any key combination to send it" data-icon="keyboard"><span class="ic"></span><span class="lbl">Record shortcut</span></button>
    </div>
  </section>
</main>

<div class="banner" id="banner" data-state="paused">
  <div class="bn-inner">
    <svg class="sig" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="4" width="3" height="10"/><rect x="6.5" y="2" width="3" height="12"/><rect x="11.5" y="6" width="3" height="8"/></svg>
    <div class="bn-text" role="status" aria-live="polite"><strong id="bn-title">Not listening</strong><span id="bn-sub">Click the page to listen for your remote</span></div>
    <div class="bn-last" id="bn-last"></div>
  </div>
</div>

<div class="pop" id="pop" hidden></div>
<dialog id="modal" tabindex="-1">
  <div class="dialog-head">
    <h2 id="modal-title"></h2>
    <button id="close-modal" class="icon" data-tip="Close" aria-label="Close"></button>
  </div>
  <div id="modal-body"></div>
</dialog>
<div id="tip" role="tooltip" hidden></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<div id="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
